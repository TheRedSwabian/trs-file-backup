name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv run --locked pre-commit run --all-files

  test:
    runs-on: ubuntu-latest
    permissions:
      checks: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14", "3.15"]
    env:
      # Overrides the 3.13-only range in .python-version for this matrix entry.
      UV_PYTHON: ${{ matrix.python-version }}
      # Only uv-managed Pythons, so a runner's older 3.13 patch below requires-python is never picked.
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked --group dev
      - run: uv run --locked pytest --cov-report=xml:coverage.xml --junitxml=junit.xml

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          files: junit.xml
          report_type: test_results
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Publish JUnit test results
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: junit.xml
          check_name: Test Results (Python ${{ matrix.python-version }})
          fail_on_failure: true
          require_tests: true
          detailed_summary: true
          include_passed: false

  commit-messages:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Check every commit message of the pull request
        run: |
          status=0
          msg_file="$RUNNER_TEMP/commit-msg.txt"
          # HEAD is the merge commit GitHub builds for the pull request: HEAD^1 is the base it merged onto, HEAD^2 the pull request's head.
          # A separate assignment, so that a failing rev-list stops the job instead of checking nothing.
          shas=$(git rev-list --reverse HEAD^1..HEAD^2)
          for sha in $shas; do
            git log -1 --format=%B "$sha" > "$msg_file"
            # commitizen reads CRLF as LF, but semantic-release does not, so a CRLF message could hide a breaking footer.
            if ! tr -d '\r' < "$msg_file" | cmp -s - "$msg_file"; then
              echo "::error::Commit $sha has Windows line endings (CRLF) in its message; see CONTRIBUTING.md, section \"Commit Message Format\"."
              status=1
              continue
            fi
            if ! uv run --locked pre-commit run commitizen --hook-stage commit-msg --commit-msg-filename "$msg_file"; then
              echo "::error::Commit $sha breaks the commit message rule; see CONTRIBUTING.md, section \"Commit Message Format\"."
              status=1
            fi
          done
          exit "$status"

  release:
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: release
    concurrency: release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Release
        uses: python-semantic-release/python-semantic-release@v10
        id: release
        with:
          github_token: ${{ steps.app-token.outputs.token }}

      - name: Publish GitHub Release
        uses: python-semantic-release/publish-action@v10
        if: steps.release.outputs.released == 'true'
        with:
          github_token: ${{ steps.app-token.outputs.token }}

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        if: steps.release.outputs.released == 'true'
