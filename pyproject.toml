[project]
name = "trs-file-backup"
version = "3.1.2"
description = "Script to backup changed files in a given folder."
authors = [{ name = "Ruediger Reiner" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.13.17"
dependencies = [
    "py-app-dev>=2.6",
    "typer>=0.16",
    "rich>=13.7",
    "watchdog>=4.0",
]

[project.scripts]
bcs = "trs_file_backup.main:cli"
trs-file-backup = "trs_file_backup.main:cli"



[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-mock>=3.14",
    "python-semantic-release>=10",
    "pre-commit>=4.0",
    "mypy>=2.4.1",
]
docs = [
    "myst-parser>=0.16",
    "sphinx>=4.0",
    "sphinx-copybutton>=0.5",
    "sphinx-new-tab-link>=0.2",
    "sphinx-book-theme>=1.1",
    "sphinx-design>=0.5",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
# Keep the steps joined by &&; see CONTRIBUTING.md "Version Files".
build_command = "pip install uv && uv lock && uv build"
assets = ["uv.lock"]

[tool.semantic_release.branches.main]
match = "develop"
prerelease = false

[tool.semantic_release.commit_parser_options]
# Rebase-merge only; see CONTRIBUTING.md "Commit Message Format".
parse_squash_commits = false
# The commit types of [tool.commitizen] below, except revert; see CONTRIBUTING.md "Commit Message Format".
minor_tags = ["feat"]
patch_tags = ["fix"]
other_allowed_tags = ["build", "chore", "ci", "docs", "style", "refactor", "test"]
allowed_tags = ["feat", "fix", "build", "chore", "ci", "docs", "style", "refactor", "test"]

[tool.semantic_release.changelog]
exclude_commit_patterns = [
    "chore*",
    "ci*",
]

[tool.semantic_release.changelog.environment]
keep_trailing_newline = true

[tool.semantic_release.remote]
type = "github"


[tool.commitizen]
# The commit message rule; CONTRIBUTING.md "Commit Message Format" explains it.
name = "cz_customize"
# No message escapes the pattern: Merge, Revert, fixup!, squash! and the like fail.
allowed_prefixes = []

[tool.commitizen.customize]
schema = "<type>(<scope>)!: <subject> (#<issue>, #<issue>)"
example = "feat(cli): add the config command (#12)"
schema_pattern = '(?s)(?#Commit message rule: see CONTRIBUTING.md, section "Commit Message Format".)(?!(?:docs|style|refactor|test|ci|chore|revert)(?:\([^()\s]+\))?: BREAKING[ -]CHANGE:)(?!(?:docs|style|refactor|test|ci|chore|revert)[^\n]*(?:\n.*)?\n[^\S\n]*BREAKING[ -]CHANGE:)(?!.*[^\n]\n[^\S\n]*BREAKING[ -]CHANGE:)(?:(?:feat|fix|build)(?:\([^()\s]+\))?!?|(?:docs|style|refactor|test|ci|chore|revert)(?:\([^()\s]+\))?): (?!\s)(?:(?!#\s*\d)(?!\)!?:)[^\n])+?(?: \(#\d+(?:, #\d+)*\))?[ \t]*(?:\n\n.*)?\Z'


[tool.pytest.ini_options]
addopts = "-vv -Wdefault --cov=trs_file_backup --cov-report=term-missing:skip-covered --capture=tee-sys --junitxml=build/tests/test-report.xml"
pythonpath = ["src"]


[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "@overload",
    "if TYPE_CHECKING",
    "raise NotImplementedError",
    'if __name__ == "__main__":',
]


[tool.ruff]
line-length = 180
lint.ignore = [
    "D203", # 1 blank line required before class docstring
    "D212", # Multi-line docstring summary should start at the first line
    "D100", # Missing docstring in public module
    "D101", # Missing docstring in public class
    "D102", # Missing docstring in public method
    "D103", # Missing docstring in public function
    "D104", # Missing docstring in public package
    "D107", # Missing docstring in `__init__`
    "D401", # First line of docstring should be in imperative mood
]
lint.select = [
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "S",   # flake8-bandit
    "F",   # pyflake
    "E",   # pycodestyle
    "W",   # pycodestyle
    "UP",  # pyupgrade
    "I",   # isort
    "RUF", # ruff specific
]
[tool.ruff.lint.per-file-ignores]
"tests/**/*" = [
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "S101",
]
"conftest.py" = ["D100"]
"docs/conf.py" = ["D100"]

[tool.ruff.lint.isort]
known-first-party = ["trs_file_backup", "tests"]


[tool.mypy]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
mypy_path = "src/"
no_implicit_optional = true
show_error_codes = true
warn_unreachable = true
warn_unused_ignores = true
exclude = [
    'docs/.*',
]

[[tool.mypy.overrides]]
module = "tests.*"
allow_untyped_defs = true

[[tool.mypy.overrides]]
module = "docs.*"
ignore_errors = true


[tool.hatch.build.targets.wheel]
packages = ["src/trs_file_backup"]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
