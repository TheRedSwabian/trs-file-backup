[project]
name = "trs-file-backup"
version = "1.0.4"
description = "Script to backup changed files in a given folder."
authors = [{ name = "Ruediger Reiner" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "py-app-dev>=2.6",
    "typer>=0.16",
    "rich>=13.7",
    "watchdog>=4.0",
]

[project.scripts]
bcs = "trs_file_backup.main:app"
trs-file-backup = "trs_file_backup.main:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-mock>=3.14",
    "python-semantic-release>=9.1",
    "ruff>=0",
    "pre-commit>=4.0",
]
docs = [
    "myst-parser>=0.16",
    "sphinx>=4.0",
    "sphinxcontrib-mermaid>=0.9",
    "mlx-traceability>=10.0",
    "sphinx-copybutton>=0.5",
    "sphinx-new-tab-link>=0.2",
    "sphinx-book-theme>=1.1",
    "sphinx-design>=0.5",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = [
    "src/trs_file_backup/__init__.py:__version__",
    "docs/conf.py:release",
]
build_command = "uv build"

[tool.semantic_release.branches.main]
match = "develop"
prerelease = false

[tool.semantic_release.changelog]
exclude_commit_patterns = [
    "chore*",
    "ci*",
]

[tool.semantic_release.changelog.environment]
keep_trailing_newline = true

[tool.semantic_release.remote]
type = "github"

[tool.pytest.ini_options]
addopts = "-vv -Wdefault --cov=trs_file_backup --cov-report=term-missing:skip-covered --capture=tee-sys --junitxml=build/tests/test-report.xml"
pythonpath = ["src"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "@overload",
    "if TYPE_CHECKING",
    "raise NotImplementedError",
    'if __name__ == "__main__":',
]

[tool.ruff]
target-version = "py38"
line-length = 180
lint.ignore = [
    "D203", # 1 blank line required before class docstring
    "D212", # Multi-line docstring summary should start at the first line
    "D100", # Missing docstring in public module
    "D101", # Missing docstring in public class
    "D102", # Missing docstring in public method
    "D103", # Missing docstring in public function
    "D104", # Missing docstring in public package
    "D107", # Missing docstring in `__init__`
    "D401", # First line of docstring should be in imperative mood
]
lint.select = [
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "S",   # flake8-bandit
    "F",   # pyflake
    "E",   # pycodestyle
    "W",   # pycodestyle
    "UP",  # pyupgrade
    "I",   # isort
    "RUF", # ruff specific
]
[tool.ruff.lint.per-file-ignores]
"tests/**/*" = [
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "S101",
]
"conftest.py" = ["D100"]
"docs/conf.py" = ["D100"]

[tool.ruff.lint.isort]
known-first-party = ["trs-file-backup", "tests"]

[tool.mypy]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
mypy_path = "src/"
no_implicit_optional = true
show_error_codes = true
warn_unreachable = true
warn_unused_ignores = true
exclude = [
    'docs/.*',
]

[[tool.mypy.overrides]]
module = "tests.*"
allow_untyped_defs = true

[[tool.mypy.overrides]]
module = "docs.*"
ignore_errors = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trs_file_backup"]
